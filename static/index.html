<!doctype html>
<html lang="en" prefix="og: https://ogp.me/ns#">
  <head>
        <meta charset="utf-8">
        <title itemprop="name">HackedYour.info</title>
        <meta name="description" itemprop="description" content="You can modify and share this. Just press CTRL-D">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <meta name="theme-color" content="#004400">
        <link rel="canonical" href="{{URL}}">

        <!-- Open Graph / Facebook / LinkedIn -->
        <meta property="og:type" content="article">
        <meta property="og:site_name" content="HackedYour.info">
        <meta property="og:title" content="{{TITLE}}">
        <meta property="og:description" content="You can modify and share this. Just press CTRL-D">
        <meta property="og:url" content="{{URL}}">
        <meta property="og:image" itemprop="image" content="codeicon.png">
        <meta property="og:image:secure_url" content="codeicon.png">
        <meta property="og:image:type" content="image/png">
        <meta property="og:image:width" content="780">
        <meta property="og:image:height" content="600">
        <meta property="og:image:alt" content="HackedYour.info paste preview">

        <!-- Twitter / X -->
        <meta name="twitter:card" content="summary_large_image">
        <meta name="twitter:site" content="@adamoutler">
        <meta name="twitter:creator" content="@adamoutler">
        <meta name="twitter:title" content="{{TITLE}}">
        <meta name="twitter:description" content="You can modify and share this. Just press CTRL-D">
        <meta name="twitter:image" content="codeicon.png">
        <meta name="twitter:image:alt" content="HackedYour.info paste preview">

        <link rel="stylesheet" type="text/css" href="application.min.css?v=3"/>
        <link rel="stylesheet" type="text/css" href="highlight.min.css?v=3"/>
		
        <script src="//ajax.googleapis.com/ajax/libs/jquery/1.10.2/jquery.min.js"></script>
        <script src="markdown.min.js?v=3"></script>
        <script src="application.min.js?v=3"></script>
        <script src="highlight.min.js?v=3"></script>

        <script type="text/javascript">
            var app = null;
            var handlePop = function(evt) {
                var path = evt.target.location.pathname;
                if (path === '/') { app.newDocument(true); } else { app.loadDocument(path.substring(1, path.length)); }
            };
            setTimeout(function() {
                window.onpopstate = function(evt) {
                    try { handlePop(evt); } catch(err) { }
                };
            }, 1000);
            $(function() {
                app = new haste();
                handlePop({ target: window });
            });
        </script>
    </head>

    <body>

        <div id="tools">
            <div class="save function" title="Save [Ctrl + S]"></div>
            <div class="new function" title="New [Ctrl + N]"></div>
            <div class="duplicate function" title="Duplicate [Ctrl + D]"></div>
            <div class="raw function" title="Raw [Ctrl + Shift + R]"></div>
            <div class="twitter function" title="Tweet [Ctrl + Shift + T]"></div>
            <div class="markdown function" title="Toggle Markdown Preview / View [Ctrl + Shift + M]">MD</div>
        </div>
        <div id="content">
            <div id="write-bar" style="display:none;">
                <button type="button" id="btn-write-edit" class="write-btn active">Write</button>
                <button type="button" id="btn-write-preview" class="write-btn">Preview</button>
            </div>
            <div id="markdown" class="markdown-body" style="display:none;" tabindex="0"></div>
            <pre id="code" style="display:none;" tabindex="0"><code></code></pre>
            <textarea placeholder="Paste here, press Ctrl-s, then copy the page URL" spellcheck="false" style="display:none;"></textarea>
        </div>
    </body>
  <script src="activate-power-mode.js"></script>
  <script>
    POWERMODE.colorful = true; // make power mode colorful
    document.body.addEventListener('input', POWERMODE);
</script>
</html>
